<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d5a43">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Г.Т. Строй постове</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="update" id="update" hidden>
  <span>Приложението се обнови.</span>
  <button type="button" class="btn sm" id="reload">Презареди</button>
</div>

<div class="app">
  <header class="top" id="top">
    <button type="button" class="back" id="back" aria-label="Назад" hidden>←</button>
    <span class="mark" id="brandmark" hidden><i class="logo-h" aria-hidden="true"></i><b id="brandtxt">Г.Т. СТРОЙ</b></span>
    <div class="top-t"><h1 id="title"></h1><p id="sub" hidden></p></div>
    <div class="prog" id="prog" hidden aria-hidden="true"></div>
  </header>
  <main id="view" tabindex="-1"></main>
</div>

<nav class="tabs" id="tabs" aria-label="Главно меню">
  <a href="#/" data-tab="home"><span class="ti">🏠</span><span>Начало</span></a>
  <a href="#/objects" data-tab="objects"><span class="ti">🏗️</span><span>Обекти</span></a>
  <a href="#/plan" data-tab="plan"><span class="ti">📅</span><span>План</span></a>
  <a href="#/history" data-tab="history"><span class="ti">🕘</span><span>История</span></a>
  <a href="#/settings" data-tab="settings"><span class="ti">⚙️</span><span>Настройки</span></a>
</nav>
<div class="wbar" id="wbar" hidden></div>
<div class="snack" id="snack" role="status" hidden></div>
<canvas id="cv" hidden></canvas>

<noscript><p style="padding:24px;font:18px sans-serif">Приложението се нуждае от JavaScript, за да работи.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
